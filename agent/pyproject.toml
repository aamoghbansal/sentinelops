[project]
name = "sentinelops-agent"
version = "0.1.0"
description = "SentinelOps local Agent"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sentinelops-agent = "sentinelops_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
